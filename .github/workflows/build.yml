name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shaders:
    name: Shaders (glslang + headless preview)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install glslang and Mesa
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q glslang-tools libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Validate shaders as GLSL ES 3.10
        run: |
          for f in app/src/main/assets/shaders/*; do
            echo "== $f"; glslangValidator "$f"
          done
      - name: Run the real shaders headless
        run: |
          pip install -q moderngl pillow numpy
          python3 tools/preview.py --n 4096 --steps 300 --preset galaxies --out preview-galaxies.png
          python3 tools/preview.py --n 4096 --steps 300 --preset disk --out preview-disk.png
      - uses: actions/upload-artifact@v4
        with:
          name: shader-preview
          path: preview-*.png

  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/gravity-sandbox-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: gravity-sandbox-apk
          path: out/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
