[package]
name = "gravity-sandbox"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "N-body particle toy: fling matter around, watch gravity make disks, planets and stars"
repository = "https://github.com/jstumfoll2/gravity-sandbox"
rust-version = "1.95"
publish = false

[dependencies]
wgpu = "30"
winit = "0.30"
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
# No "links" (would open a web browser) and no clipboard: the app has no reason to reach outside.
egui-winit = { version = "0.37", default-features = false, features = ["x11", "wayland"] }
egui-wgpu = { version = "0.37", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.18"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1
